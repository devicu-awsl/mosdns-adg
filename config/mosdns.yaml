# mosdns v5 - CN / foreign split resolver. Listens 0.0.0.0:5335.
# AdGuard Home sits in front on :53 and uses this as its only upstream.
# Ad / malware blocking belongs in AdGuardHome.yaml, not here.
#
# Every hostname upstream is pinned with dial_addr - no bootstrap anywhere.
# If you add one, pin it, or mosdns falls back to the container's system
# resolver, which on RouterOS may point back at AdGuard Home (loop).
#
# Transport choice: DoT domestically (853 is open inside CN and pipelined
# DoT is cheaper on the RB5009's CPU), DoH for remote (853 is trivially
# blocked from CN; 443 blends into normal HTTPS). enable_pipeline is
# RFC 7766 and applies to tcp:// and tls:// only - a no-op on https://.
#
# Apple domains are split three ways; see README "Why Apple domains are
# split three ways" for the reasoning behind each set.

log:
  level: warn

api:
  http: "0.0.0.0:8080"          # /metrics, /plugins/cache/flush, /plugins/cache/dump

plugins:
  # ---------- data sets ----------
  # direct-list + apple-cn, merged/deduped/suffix-collapsed at build time.
  # ~112k entries; this is by far the largest RAM consumer in mosdns and
  # cannot be shrunk further without losing CN coverage.
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - /data/mosdns/rules/geosite_cn.txt

  # Reduced proxy list: only entries that can override a CN match (~460 of
  # 27k). Everything else already reaches the remote branch by default, so
  # loading the full list would cost RAM for zero behaviour change.
  # If you enable seq_default_cn_first below, that assumption breaks -
  # switch this to geosite_proxy_full.txt.
  - tag: geosite_proxy
    type: domain_set
    args:
      files:
        - /data/mosdns/rules/geosite_proxy.txt

  # geoip_cn is ONLY used by seq_china_probe (cn-first mode, disabled below).
  # mosdns instantiates every plugin whether referenced or not, so leaving it
  # enabled would load ~5.8k CIDRs for nothing. Uncomment as a set with the
  # two sequences near the bottom.
  # - tag: geoip_cn
  #   type: ip_set
  #   args:
  #     files:
  #       - /data/mosdns/rules/geoip_cn.txt

  # ---------- Apple split-DNS sets ----------
  # Bare entry = suffix match, full: = exact match.

  # [Host] -> Cloudflare: forces Apple's international media CDN edge
  # instead of the China CDN. Does not change Apple ID region or catalog.
  - tag: apple_intl_host
    type: domain_set
    args:
      exps:
        - tv.apple.com
        - video.apple.com
        - music.apple.com          # suffix, so amp-api.music.apple.com is covered
        - streamingaudio.itunes.apple.com
        - audio-ssl.itunes.apple.com

  # [PROXY] -> remote DoH, so DNS matches a proxied egress.
  - tag: apple_intl
    type: domain_set
    args:
      exps:
        - fitness.apple.com
        - arcade.apple.com
        - full:games.apple.com

  # iCloud Private Relay + Apple DoH. Must resolve to genuine Apple/relay
  # IPs or Private Relay will not come up. Matched before apple_direct.
  - tag: apple_relay
    type: domain_set
    args:
      exps:
        - apple-dns.net
        - apple-relay.cloudflare.com
        - apple-relay.akamaized.net
        - apple-relay.fastly-edge.com
        - doh.dns.apple.com.v.aaplimg.com

  # [DIRECT] -> China DNS. mzstatic = artwork/static, identical worldwide
  # and much faster from the CN CDN. Move to apple_intl_host to change that.
  - tag: apple_direct
    type: domain_set
    args:
      exps:
        - apple.com.cn
        - icloud.com.cn
        - mzstatic.com
        - aaplimg.com

  # ---------- cache ----------
  # dump_interval kept high: /data is a USB stick, minimise write cycles.
  - tag: cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      dump_file: /data/mosdns/cache.dump
      dump_interval: 3600

  # ---------- upstreams ----------
  # concurrent: 2 queries two upstreams from the pool in parallel; first
  # valid answer wins. Keep pools SMALL and every entry reachable - a dead
  # entry can be sampled and stall the query. Test before adding:
  #   mosdns probe pipeline tls://dns.alidns.com
  # One entry per provider: same provider over two transports is one trust
  # boundary occupying two slots, not redundancy.

  - tag: forward_china
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "tls://dns.alidns.com"
          dial_addr: "223.5.5.5"
          enable_pipeline: true
          idle_timeout: 86400
        - addr: "tls://dot.pub"
          dial_addr: "1.12.12.12"
          enable_pipeline: true
          idle_timeout: 86400
        # DoH as second path per provider (different IP + transport)
        - addr: "https://223.6.6.6/dns-query"
          idle_timeout: 86400
        - addr: "https://doh.pub/dns-query"
          dial_addr: "120.53.53.53"
          idle_timeout: 86400
        - addr: "tls://dot.360.cn"
          dial_addr: "218.30.118.6"          
          enable_pipeline: true
          idle_timeout: 86400
        # Not included: sm2.doh.pub. It works (dual-cert endpoint, mosdns
        # gets standard TLS - Go has no SM2), but it is DNSPod again, so it
        # adds a slot and no diversity. 360: needs a verified dial_addr IP.

  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1"
          idle_timeout: 86400
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
          idle_timeout: 86400
        - addr: "https://dns.quad9.net/dns-query"
          dial_addr: "9.9.9.9"
          idle_timeout: 86400
        - addr: "https://dns.opendns.com/dns-query"
          dial_addr: "208.67.222.222"
          idle_timeout: 86400
        # Deliberately absent: DoT variants (853 blocked from CN), and
        # Umbrella / Cisco SSE (no stable anycast IP to pin, and they are
        # the same operator as OpenDNS above).
        #
        # BEST OPTION in mainland China - replace all four above with your
        # proxy's DNS listener:
        # - addr: "udp://192.168.88.x:1053"

  # Cloudflare-only, for the Apple [Host] override
  - tag: forward_cloudflare
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1"
          idle_timeout: 86400
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.0.0.1"
          idle_timeout: 86400

  # ---------- sequences ----------
  - tag: seq_china
    type: sequence
    args:
      - exec: $forward_china

  - tag: seq_remote
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_remote

  - tag: seq_cloudflare
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_cloudflare

  # --- optional default-branch strategy (see README) ---
  # Domestic answer trusted only if it lands on a CN IP; no terminal accept,
  # so falling through is the signal that the branch failed.
  # - tag: seq_china_probe
  #   type: sequence
  #   args:
  #     - exec: $forward_china
  #     - matches: resp_ip $geoip_cn
  #       exec: accept

  # Try domestic first, verify by IP, fall back to remote. Better CDN
  # proximity for CN sites missing from direct-list.txt, at the cost of
  # showing every unknown domain to a CN resolver.
  # - tag: seq_default_cn_first
  #   type: fallback
  #   args:
  #     primary: seq_china_probe
  #     secondary: seq_remote
  #     threshold: 500
  #     always_standby: false
  #
  # To enable cn-first mode, uncomment ALL FOUR of: geoip_cn, seq_china_probe,
  # seq_default_cn_first, and switch the last line of "main" to it. Also point
  # geosite_proxy at geosite_proxy_full.txt - the reduced list is only valid
  # while the default branch is seq_remote.

  - tag: main
    type: sequence
    args:
      - exec: $cache
      - matches: has_resp
        exec: accept
      # Each branch below is followed by has_resp/accept rather than goto,
      # so a failed branch falls through to the generic remote branch at
      # the end instead of returning SERVFAIL. This is deliberate.
      - matches: qname $apple_intl_host      # Apple TV+/Music -> intl CDN
        exec: $seq_cloudflare
      - matches: has_resp
        exec: accept
      - matches: qname $apple_intl           # Apple intl services (PROXY)
        exec: $seq_remote
      - matches: has_resp
        exec: accept
      - matches: qname $apple_relay          # iCloud Private Relay / Apple DoH
        exec: $seq_remote
      - matches: has_resp
        exec: accept
      - matches: qname $apple_direct         # Apple CN CDN (DIRECT)
        exec: $seq_china
      - matches: has_resp
        exec: accept
      - matches: qname $geosite_proxy        # known GFW/proxy domains
        exec: $seq_remote
      - matches: has_resp
        exec: accept
      - matches: qname $geosite_cn           # CN domains
        exec: $seq_china
      - matches: has_resp
        exec: accept
      # Default: everything unlisted goes remote (no CN resolver sees it).
      # Swap for $seq_default_cn_first to prefer domestic-with-IP-check.
      - exec: $seq_remote

  # ---------- servers ----------
  - tag: udp_srv
    type: udp_server
    args:
      entry: main
      listen: "0.0.0.0:5335"

  - tag: tcp_srv
    type: tcp_server
    args:
      entry: main
      listen: "0.0.0.0:5335"
